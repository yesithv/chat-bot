<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Chat Assistant powered by BlenderBot" />
    <meta name="author" content="YesithV" />
    <title>AI Chat Assistant</title>

    <link rel="shortcut icon" href="{{ url_for('static', filename='images/chat.png') }}" type="image/x-icon" />
    <link rel="icon" href="{{ url_for('static', filename='images/chat.png') }}" type="image/png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>

    <main>
      <div class="chatbot">
        <div class="chat-header">
          <img src="{{ url_for('static', filename='images/chat.png') }}" alt="Chatbot" class="header-logo" />
          <h1>AI Chat Assistant</h1>
        </div>
        <div class="header-sub-text">
          <p>Copyright &copy; 2026 &mdash; Created by YesithV <span class="red">&#10084;</span></p>
        </div>

        <div class="spacer" id="messages-container"></div>

        <form class="chat-form" id="message-form">
          <textarea id="message-input" placeholder="Send a message..." rows="1"></textarea>
          <button type="submit" aria-label="Send message">&#10148;</button>
        </form>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
